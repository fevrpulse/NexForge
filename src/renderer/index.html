<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexForge</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Runs before first paint so heavy effects never flash on then off.
      (function () {
        function isTier(t) {
          return t === 'high' || t === 'balanced' || t === 'low';
        }
        var tier;
        // An explicit choice always wins.
        try { tier = localStorage.getItem('nf-fx-tier'); } catch (e) {}
        if (!isTier(tier)) {
          // Otherwise reuse the tier Auto measured last time, so a machine that
          // could not hold a smooth frame rate is not put back on the expensive
          // tier every launch (the frame-rate probe only runs once per install).
          try { tier = localStorage.getItem('nf-fx-auto-tier'); } catch (e) {}
        }
        if (!isTier(tier)) {
          // Reduced-motion is deliberately not consulted here: it means "less
          // movement", not "weaker GPU", and the reduced-motion media queries
          // already stop the animation. Tier is about rendering cost only.
          var cores = navigator.hardwareConcurrency || 4;
          var mem = navigator.deviceMemory || 4;
          tier = (cores <= 2 || mem <= 2) ? 'low'
               : (cores >= 8 && mem >= 8) ? 'high'
               : 'balanced';
        }
        document.documentElement.setAttribute('data-fx', tier);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
