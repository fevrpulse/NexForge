name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # One build, one publish. Building separately first meant electron-builder
      # ran twice on a tag: the first run had no GH_TOKEN yet still tried to
      # publish (its default policy is onTagOrDraft) and failed the job, and a
      # second build would anyway produce a different sha512 than the first.
      - name: Build and publish Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $hasYml = $false
          try {
            $rel = gh release view $tag --json assets | ConvertFrom-Json
            $hasYml = @($rel.assets.name) -contains 'latest.yml'
          } catch {
            Write-Output "No GitHub release for $tag yet"
          }
          if ($hasYml) {
            Write-Output 'Skipping: latest.yml already published for this tag.'
            exit 0
          }
          npm run build:renderer
          npx --no-install electron-builder --win --publish always -c.forceCodeSigning=false
