name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build Windows installer
        run: npm run build
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $hasYml = $false
          try {
            $rel = gh release view $tag --json assets | ConvertFrom-Json
            $hasYml = @($rel.assets.name) -contains 'latest.yml'
          } catch {
            Write-Output "No GitHub release for $tag yet"
          }
          if ($hasYml) {
            Write-Output 'Skipping publish: latest.yml already exists (avoids sha512 mismatch from a second build).'
            exit 0
          }
          npx --no-install electron-builder --win --publish always -c.forceCodeSigning=false
