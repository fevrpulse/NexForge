name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history + permission to push the version bump commit/tag.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # electron-updater only installs a newer semver. Keep shipping as 1.2.x
      # automatically: each merge to main becomes 1.2.1, 1.2.2, …
      - name: Bump patch version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore: release %s"

      - name: Publish Windows release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version bump and tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: git push origin HEAD:main --follow-tags
