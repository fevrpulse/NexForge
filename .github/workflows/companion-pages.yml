name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'companion/**'
      - '.github/workflows/companion-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site/companion
          cp site/index.html _site/index.html
          cp site/logo.png _site/logo.png
          cp site/NexForge.exe _site/NexForge.exe
          cp -a companion/. _site/companion/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
