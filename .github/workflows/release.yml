name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Build without electron-builder's publisher. Its own upload step kept
      # failing this job on tag builds, and running it a second time to publish
      # would produce an installer whose sha512 no longer matched latest.yml.
      - name: Build Windows installer
        run: npm run build

      # latest.yml already carries the hash the auto-updater verifies, so
      # uploading the build output as-is keeps updates working.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          try {
            $rel = gh release view $tag --json assets | ConvertFrom-Json
            if (@($rel.assets.name) -contains 'latest.yml') {
              Write-Output "Skipping: latest.yml is already published for $tag."
              exit 0
            }
          } catch {
            Write-Output "No GitHub release for $tag yet; creating one."
          }
          $assets = Get-ChildItem dist -File |
            Where-Object { $_.Name -eq 'latest.yml' -or $_.Extension -eq '.exe' } |
            ForEach-Object { $_.FullName }
          if (-not $assets) { throw 'No installer artifacts found in dist.' }
          Write-Output "Uploading $($assets.Count) asset(s)."
          gh release create $tag $assets --title "NexForge $tag" --notes "NexForge $tag"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
