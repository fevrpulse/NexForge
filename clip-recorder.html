<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NexForge Clip Buffer</title>
</head>
<body>
<script>
(function () {
  const api = window.clipRecorder;
  if (!api) return;

  let recorder = null;
  let stream = null;
  // The first chunk MediaRecorder emits carries the EBML/WebM init segment;
  // every later chunk is a bare cluster. It is held apart from the rolling
  // window so wrapping the window can never evict the only copy of the header.
  let headerBlob = null;
  let chunks = [];
  let seconds = 20;
  let saving = false;

  function clampSeconds(value) {
    return Math.max(8, Math.min(45, Number(value) || 20));
  }

  function windowLength() {
    // One chunk of slack so a save always has at least `seconds` of footage
    // even though the in-progress chunk has not been delivered yet.
    return seconds + 2;
  }

  function bufferedSeconds() {
    return (headerBlob ? 1 : 0) + chunks.length;
  }

  function reportStatus() {
    const buffered = bufferedSeconds();
    api.ready({
      buffering: buffered < 3,
      readySeconds: Math.min(seconds, buffered),
      seconds,
    });
  }

  function mimeType() {
    const types = [
      'video/webm;codecs=vp8,opus',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8',
      'video/webm',
    ];
    return types.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  }

  function stopTracks() {
    const dying = recorder;
    recorder = null;
    if (dying) {
      // Detach before stopping: stop() delivers one last chunk asynchronously,
      // and a late bare cluster must never be mistaken for the next header.
      dying.ondataavailable = null;
      dying.onerror = null;
      try { dying.stop(); } catch { /* ignore */ }
    }
    (stream?.getTracks() || []).forEach((t) => {
      try { t.stop(); } catch { /* ignore */ }
    });
    stream = null;
    // A header only describes the stream it came from — dropping it here stops
    // a restart from splicing a stale header onto the next recording.
    headerBlob = null;
    chunks = [];
  }

  async function start(payload) {
    stopTracks();
    seconds = clampSeconds(payload?.seconds);
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: 15, width: 1280, height: 720 },
        audio: true,
      });
    } catch (err) {
      api.error(err?.message || 'Screen capture was blocked');
      return;
    }
    const opts = { videoBitsPerSecond: 2500000 };
    const mime = mimeType();
    if (mime) opts.mimeType = mime;
    try {
      recorder = new MediaRecorder(stream, opts);
    } catch (err) {
      api.error(err?.message || 'Could not start clip recorder');
      stopTracks();
      return;
    }
    const rec = recorder;
    headerBlob = null;
    chunks = [];
    rec.ondataavailable = (ev) => {
      if (rec !== recorder) return;
      if (ev.data && ev.data.size) {
        if (!headerBlob) {
          headerBlob = ev.data;
        } else {
          chunks.push(ev.data);
          const keep = windowLength();
          if (chunks.length > keep) chunks = chunks.slice(-keep);
        }
      }
      reportStatus();
    };
    rec.onerror = (ev) => {
      api.error(ev?.error?.message || 'Clip recorder error');
    };
    rec.start(1000);
    api.ready({ buffering: true, readySeconds: 0, seconds });
  }

  /** Retune the window without restarting — a restart would drop the buffer. */
  function setWindow(payload) {
    seconds = clampSeconds(payload?.seconds);
    const keep = windowLength();
    if (chunks.length > keep) chunks = chunks.slice(-keep);
    if (recorder) reportStatus();
  }

  async function save(payload) {
    if (saving) return;
    if (!headerBlob || !chunks.length) {
      api.error('Clip buffer is still filling — play a few more seconds');
      return;
    }
    saving = true;
    try {
      // Spread now, synchronously: ondataavailable keeps firing during the
      // awaits below and must not mutate the parts being written out.
      const parts = [headerBlob, ...chunks];
      const blob = new Blob(parts, { type: headerBlob.type || 'video/webm' });
      const buf = await blob.arrayBuffer();
      await api.write({
        bytes: buf,
        game: payload?.game || '',
        label: payload?.label || 'clip',
      });
    } catch (err) {
      api.error(err?.message || 'Could not save clip');
    } finally {
      saving = false;
    }
  }

  api.onStart(start);
  api.onStop(stopTracks);
  api.onSave(save);
  api.onWindow?.(setWindow);
})();
</script>
</body>
</html>
