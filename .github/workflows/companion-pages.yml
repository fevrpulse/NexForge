name: Deploy Companion

on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - '.github/workflows/companion-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload companion
        uses: actions/upload-pages-artifact@v3
        with:
          path: companion
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
