<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NexForge Overlay</title>
  <style>
    :root {
      --bg: rgba(10, 12, 8, 0.92);
      --border: rgba(201, 255, 0, 0.35);
      --neon: #C9FF00;
      --text: #F2F5EC;
      --muted: #9aa08d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; overflow: hidden; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }
    .toast {
      width: 330px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--neon);
      border-radius: 12px;
      padding: 11px 14px;
      display: flex;
      gap: 11px;
      align-items: center;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
      animation: slide-in 0.22s ease-out;
      transition: opacity 0.35s, transform 0.35s;
    }
    .toast.leaving { opacity: 0; transform: translateX(24px); }
    @keyframes slide-in {
      from { opacity: 0; transform: translateX(36px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      background: rgba(201, 255, 0, 0.14); color: var(--neon);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; letter-spacing: 0.5px;
    }
    .info { flex: 1; min-width: 0; }
    .brand {
      font-size: 8.5px; font-weight: 700; letter-spacing: 1.6px;
      color: var(--neon); text-transform: uppercase; margin-bottom: 2px;
      font-family: Consolas, monospace;
    }
    .sender { font-size: 13.5px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 7px; }
    .unread {
      margin-left: auto; background: var(--neon); color: #111;
      font-size: 10px; font-weight: 800; border-radius: 999px;
      padding: 1px 7px; font-family: Consolas, monospace;
    }
    .body {
      font-size: 12px; color: var(--muted); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .body .photo { color: var(--neon); }
  </style>
</head>
<body>
  <script>
    const MAX_TOASTS = 4;
    const TOAST_MS = 6500;
    let liveCount = 0;

    function initials(name) {
      return String(name || '?').slice(0, 2).toUpperCase();
    }

    function addToast(msg) {
      while (document.querySelectorAll('.toast').length >= MAX_TOASTS) {
        const oldest = document.querySelector('.toast');
        oldest.remove();
        liveCount--;
      }

      const el = document.createElement('div');
      el.className = 'toast';

      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = initials(msg.sender);

      const info = document.createElement('div');
      info.className = 'info';

      const brand = document.createElement('div');
      brand.className = 'brand';
      const kind = String(msg.kind || 'message').toLowerCase();
      brand.textContent = kind === 'party'
        ? 'NexForge Party'
        : kind === 'lobby'
          ? 'NexForge Lobby'
          : kind === 'duel'
            ? 'NexForge Duel'
            : 'NexForge Message';

      if (kind === 'party') el.style.borderLeftColor = '#3B7EFF';
      if (kind === 'lobby') el.style.borderLeftColor = '#FF8C42';
      if (kind === 'duel') el.style.borderLeftColor = '#C9FF00';

      const sender = document.createElement('div');
      sender.className = 'sender';
      sender.appendChild(document.createTextNode(msg.sender || 'Friend'));
      if (msg.unread > 0) {
        const badge = document.createElement('span');
        badge.className = 'unread';
        badge.textContent = msg.unread > 99 ? '99+' : String(msg.unread);
        sender.appendChild(badge);
      }

      const body = document.createElement('div');
      body.className = 'body';
      if (msg.body) {
        body.textContent = msg.body;
      } else if (msg.image) {
        const p = document.createElement('span');
        p.className = 'photo';
        p.textContent = '📷 Sent a photo';
        body.appendChild(p);
      }
      if (msg.body && msg.image) {
        body.textContent = `📷 ${msg.body}`;
      }

      info.appendChild(brand);
      info.appendChild(sender);
      info.appendChild(body);
      el.appendChild(av);
      el.appendChild(info);
      document.body.appendChild(el);
      liveCount++;

      setTimeout(() => {
        el.classList.add('leaving');
        setTimeout(() => {
          el.remove();
          liveCount--;
          if (liveCount <= 0) {
            liveCount = 0;
            window.nexforgeOverlay?.empty();
          }
        }, 380);
      }, TOAST_MS);
    }

    window.nexforgeOverlay?.onMessage(addToast);
  </script>
</body>
</html>
